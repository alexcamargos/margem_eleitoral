predictive_model:
  half_life_days: 14.0
  trend_window_days: 14
  drift_damping: 0.65
  swing_gain: 0.45
  t1_calibration_lambda: 0.25
  t1_bias_shrinkage: 0.45
  peer_tilt_shrinkage: 0.50
  structural_tse_sigma: 1.35
  n_simulations: 10000
  random_seed: 42
