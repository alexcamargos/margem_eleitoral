audit_parameters:
  eve_cutoff_days: 3 # 72 horas antes da votação para pesquisas de véspera
  half_life_days: 14 # Meia-vida em dias para decaimento temporal exponencial
  default_deff: 1.3  # Fator de correção de delineamento amostral médio
  deff_min: 1.2
  deff_max: 1.5
  confidence_level: 0.95
  credible_intervals:
    - 0.80
    - 0.95

typical_error_thresholds:
  below_typical_max: 3.5 # Erro ponderado <= 3.5 é considerado abaixo do típico
  typical_max: 6.5       # Erro ponderado <= 6.5 é considerado erro típico
                         # Acima de 6.5 é erro acima do típico

